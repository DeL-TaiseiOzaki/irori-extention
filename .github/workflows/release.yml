name: Release

# `v1.2.3` 形式のタグを push すると Marketplace に公開し，GitHub Release に .vsix を添付する．
# 事前に Marketplace の Personal Access Token をリポジトリの Secrets に VSCE_PAT として登録すること．
on:
  push:
    tags: ['v*']
  # Actions タブから手動実行する場合は「Use workflow from」でタグ（例: v0.1.0）を選ぶこと．
  # ブランチを選ぶと version 一致チェックで失敗する．
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run test:unit
      - name: Check tag matches package.json version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "このワークフローはタグ上で実行してください（Use workflow from でタグを選択）．現在: $GITHUB_REF_TYPE $GITHUB_REF_NAME" >&2
            exit 1
          fi
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
      - name: Extract release notes from CHANGELOG
        # 公開前に実行する．CHANGELOG にタグと同じバージョンの節が無い，または空なら
        # ここで失敗させ，Marketplace への公開そのものを止める（公開は取り消せない）．
        # 生成先はワークスペース外（RUNNER_TEMP）．作業ツリーにファイルを増やすと
        # .vscodeignore は deny-list なので .vsix に紛れ込む．
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          ./scripts/changelog-section.sh "$GITHUB_REF_NAME" > "$NOTES_FILE"
          echo "RELEASE_NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"
          echo "----- GitHub Release の本文として使う内容 -----"
          cat "$NOTES_FILE"
      - name: Verify package contents
        # .vsix に入るファイルを許可リストと突き合わせる．想定外のファイルが 1 つでも
        # あれば公開前に失敗する．
        run: ./scripts/check-vsix-contents.sh
      - name: Package
        run: npx @vscode/vsce package --out "irori-${GITHUB_REF_NAME#v}.vsix"
      - name: Publish to Marketplace
        run: npx @vscode/vsce publish --packagePath "irori-${GITHUB_REF_NAME#v}.vsix"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: irori-*.vsix
          # コミット一覧の自動生成ではなく，手で書いた CHANGELOG の該当節を本文にする．
          body_path: ${{ env.RELEASE_NOTES_FILE }}
