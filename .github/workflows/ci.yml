name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run test:unit
      - name: Verify package contents
        run: ./scripts/check-vsix-contents.sh
      - name: Package (dry run)
        run: npx @vscode/vsce package --out irori.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: irori-vsix
          path: irori.vsix
